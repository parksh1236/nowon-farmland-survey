<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노원구 농지 전주소자 기본조사 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin:0; padding:0; height:100%; font-family:"Malgun Gothic",sans-serif; }
  #map { width:100%; height:100%; }
  #panel {
    position:absolute; top:10px; left:10px; z-index:10;
    background:#fff; padding:10px 14px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.25); font-size:13px; max-width:280px;
  }
  #panel select { font-size:13px; margin-top:4px; max-width:200px; }
  .status { margin-top:6px; color:#555; }
  .progressWrap { background:#eee; border-radius:4px; height:8px; margin-top:4px; overflow:hidden; }
  .progressBar { background:#e0533d; height:100%; width:0%; transition:width .2s; }
  .iw { padding:8px 10px; font-size:12px; line-height:1.5; max-width:280px; }
  .iw b { font-size:13px; }
  .iw table { border-collapse:collapse; margin-top:4px; }
  .iw td { border-top:1px solid #eee; padding:2px 4px; vertical-align:top; }
</style>
</head>
<body>
<div id="panel">
  <div><b>노원구 농지 전주소자 기본조사</b></div>
  <div>동 선택: <select id="dongFilter"><option value="">전체</option></select></div>
  <div>지목: <select id="jimokFilter"><option value="">전체</option></select></div>
  <div><label><input type="checkbox" id="cadastralToggle"> 지적편집도</label></div>
  <div class="status" id="status">데이터 불러오는 중...</div>
  <div class="progressWrap"><div class="progressBar" id="progress"></div></div>
</div>
<div id="map"></div>

<script>
const sdk = document.createElement('script');
sdk.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=076025236f8d811aefef8b324870a3af&libraries=services,clusterer&autoload=false';
sdk.onload = () => kakao.maps.load(init);
document.head.appendChild(sdk);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function init() {
  const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.6390, 127.0745),
    level: 6
  });
  const geocoder = new kakao.maps.services.Geocoder();
  const clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter:true, minLevel:5 });
  const redMarker = new kakao.maps.MarkerImage(
    'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png',
    new kakao.maps.Size(32, 35), { offset: new kakao.maps.Point(16, 35) }
  );
  const statusEl = document.getElementById('status');
  const progressEl = document.getElementById('progress');
  const dongFilter = document.getElementById('dongFilter');
  const jimokFilter = document.getElementById('jimokFilter');
  const items = [];
  let openIw = null;

  document.getElementById('cadastralToggle').addEventListener('change', (e) => {
    if (e.target.checked) map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
  });

  const CACHE_KEY = 'nonggi_geocode_cache_v1';
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(e) { cache = {}; }
  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e) {}
  }

  function geocodeOne(addr) {
    return new Promise((resolve) => {
      const cached = cache[addr];
      if (cached) { resolve(cached.fail ? null : cached); return; }
      geocoder.addressSearch(addr, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result[0]) {
          cache[addr] = { x: result[0].x, y: result[0].y };
          resolve(cache[addr]);
        } else {
          cache[addr] = { fail: true };
          resolve(null);
        }
      });
    });
  }

  function fillSelect(sel, values, label = v => v) {
    for (const v of values) {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = label(v);
      sel.appendChild(opt);
    }
  }

  const infoHtml = r => `<div class="iw"><b>${esc(r.addr)}</b><br>
    행정동: ${esc(r.hdong)} · 지목: ${esc(r.jimok)} · 면적: ${esc(r.area)}㎡<br>
    소유인 수: ${esc(r.ownerCount)} · 주말·체험영농: ${esc(r.weekendFarm)}
    <table>
      <tr><td>자경 농지(추정)</td><td>${esc(r.selfFarm)}</td></tr>
      <tr><td>임대차 농지(추정)</td><td>${esc(r.lease)}</td></tr>
      <tr><td>경작현황(추정)</td><td>${esc(r.cultivation)}</td></tr>
      <tr><td>조사상태</td><td>${esc(r.status)}</td></tr>
    </table></div>`;

  const matches = r => (!dongFilter.value || r.dong === dongFilter.value) && (!jimokFilter.value || r.jimok === jimokFilter.value);

  function applyFilter() {
    clusterer.clear();
    const shown = items.filter(i => matches(i.rec)).map(i => i.marker);
    clusterer.addMarkers(shown);
    if ((dongFilter.value || jimokFilter.value) && shown.length) {
      const bounds = new kakao.maps.LatLngBounds();
      shown.forEach(m => bounds.extend(m.getPosition()));
      map.setBounds(bounds);
    }
  }
  dongFilter.addEventListener('change', applyFilter);
  jimokFilter.addEventListener('change', applyFilter);

  (async () => {
    const records = await (await fetch('survey.json')).json();
    fillSelect(dongFilter, [...new Set(records.map(r => r.dong))].sort(), d => d.replace(/^.*구\s*/, ''));
    fillSelect(jimokFilter, [...new Set(records.map(r => r.jimok).filter(Boolean))].sort());

    let done = 0, fail = 0;
    for (const rec of records) {
      const coords = await geocodeOne(rec.addr);
      done++;
      if (!coords) fail++;
      else {
        const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(coords.y, coords.x), image: redMarker });
        const iw = new kakao.maps.InfoWindow({ content: infoHtml(rec), removable: true });
        kakao.maps.event.addListener(marker, 'click', () => {
          if (openIw) openIw.close();
          iw.open(map, marker);
          openIw = iw;
        });
        items.push({ marker, rec });
        if (matches(rec)) clusterer.addMarker(marker);
      }
      if (done % 20 === 0 || done === records.length) {
        progressEl.style.width = Math.round(done / records.length * 100) + '%';
        statusEl.textContent = `지오코딩 ${done}/${records.length} (실패 ${fail})`;
        saveCache();
      }
    }
    statusEl.textContent = `완료: 총 ${records.length}필지, 지도 표시 ${records.length - fail}건, 주소매칭 실패 ${fail}건`;
  })();
}
</script>
</body>
</html>
